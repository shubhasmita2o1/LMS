spring:
  application:
    name: university-lms

  datasource:
    url: jdbc:postgresql://localhost:5432/university_lms
    username: lms_user
    password: lms_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.university.lms: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
